<style>
  body, html {

    min-height: 100vh;
    font-size: 18px;
  }
  *{ box-sizing: border-box; }
  .title-font { font-family: 'Cinzel', serif; }
  .golden-text { color: #e91e63; }

  .overlay-pattern{
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(233,30,99,.06) 0%, transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(233,30,99,.05) 0%, transparent 50%);
  }

  .hero-wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    min-height: 100vh;
    justify-content: center;
    width: 100%;
  }
  .quote-box, .watch-cta{
    width: 100%;
  }

  .eyebrow{
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #e91e63;
    margin: 0;
  }

  h1{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(2.8rem, 8vw + 1rem, 4.4rem);
    line-height: 1.12;
    margin: 0;
    color: #222222;
  }
  h1 .accent{ color: #e91e63; }

  .quote-box {
    max-width: 600px;
    margin: 6px auto 0;
  }
  .quote-box p{
    margin: 0;
    font-family: 'IM Fell English', Georgia, serif;
    font-style: italic;
    font-size: 1.7rem;
    line-height: 1.5;
    color: #333333;
  }
  .quote-box em{ color: #e91e63; font-style: italic; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #1e9e4f 0%, #34c46a 50%, #1e9e4f 100%);
    background-size: 200% auto;
    color: #ffffff; border: none; font-weight: bold;
    box-shadow: 0 4px 18px rgba(30,158,79,0.35);
    transition: all 0.35s;
    padding: 20px 40px;
    font-size: 1.35rem;
    border-radius: 30px;
    font-family: 'Cinzel', serif;
    text-decoration: none;
    margin-top: 8px;
    cursor: pointer;
  }
  .btn-primary:hover {
    background-position: right center;
    box-shadow: 0 7px 28px rgba(30,158,79,0.5);
    transform: translateY(-3px);
    color: #ffffff;
  }
  .btn-primary:focus-visible{ outline: 2px solid #1e9e4f; outline-offset: 3px; }
  .btn-primary svg{ width: 18px; height: 18px; }

  .reassure{
    font-family: 'Lato', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: #777777;
    margin: 0;
  }
  .reassure .golden-text{ margin-inline: .5em; }

  .watch-cta{
    font-family: 'Lato', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #333333;
    margin: 4px 0 0;
    max-width: 460px;
  }
  .watch-cta .golden-text{ font-weight: 800; }

  .foto{ width: 100%; max-width: 520px; display: block; }
  .foto img{ width: 100%; display: block; border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.12); }

  .site-footer {
    background-color: #fafafa;
    border-top: 2px solid rgba(233,30,99,0.35);
    padding: 28px 20px;
    margin-top: 0;
  }
  .footer-inner{
    max-width: 900px;
    margin: 0 auto;

    flex-wrap: wrap;
    gap: 10px 24px;
    align-items: center;
    justify-content: space-between;
  }
  .site-footer p{ font-size: 15px; margin: 0; color: #666666; }
  .site-footer a{ color: #666666; }
  .footer-disclaimer{

    margin: 0 auto 14px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #999999;
    text-align: center;

</div>

<footer class="site-footer">
  
  <div class="footer-inner">
    <p>© 2026 · El Truco de la Gelatina</p>  </div>
